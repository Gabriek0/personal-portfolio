            summary: '{{fields.text}}'
            fields:
              - { label: ID, name: id, widget: hidden }
              - { label: Text, name: text, widget: string }
              - { label: URL, name: url, widget: string, required: false }
              - { label: Value, name: value, widget: string, required: false }
          - label: Items
            name: items
            widget: list
            types:
              - label: Career
                name: career
                widget: object
                summary: '{{fields.title}} — {{fields.organization}}'
                fields:
                  - { label: ID, name: id, widget: hidden }
                  - { label: Title, name: title, widget: string }
                  - { label: Organization, name: organization, widget: string }
                  - { label: From, name: from, widget: string }
                  - { label: To, name: to, widget: string, required: false }
                  - { label: Location, name: location, widget: string }
                  - { label: Description, name: description, widget: text }
                  - { label: Current work, name: isCurrentWork, widget: boolean, default: false }
                  - { label: Current work label, name: currentWorkLabel, widget: string, required: false }
                  - label: Image
                    name: image
                    widget: object
                    fields:
                      - { label: ID, name: id, widget: hidden }
                      - { label: File name, name: name, widget: string }
                      - { label: Alt text, name: alt, widget: string, required: false }
                      - { label: Caption, name: caption, widget: text, required: false }
                      - { label: Width, name: width, widget: number, value_type: int }
                      - { label: Height, name: height, widget: number, value_type: int }
                      - { label: Image, name: src, widget: image }
              - label: Education
                name: education
                widget: object
                summary: '{{fields.title}} — {{fields.organization}}'
                fields:
                  - { label: ID, name: id, widget: hidden }
                  - { label: Title, name: title, widget: string }
                  - { label: Organization, name: organization, widget: string }
                  - { label: From, name: from, widget: string }
                  - { label: To, name: to, widget: string, required: false }
                  - { label: Location, name: location, widget: string }
                  - { label: Description, name: description, widget: text }
                  - label: Image
                    name: image
                    widget: object
                    fields:
                      - { label: ID, name: id, widget: hidden }
                      - { label: File name, name: name, widget: string }
                      - { label: Alt text, name: alt, widget: string, required: false }
                      - { label: Caption, name: caption, widget: text, required: false }
                      - { label: Width, name: width, widget: number, value_type: int }
                      - { label: Height, name: height, widget: number, value_type: int }
                      - { label: Image, name: src, widget: image }
      - label: Skills
        name: skills
        widget: object
        fields:
          - { label: ID, name: id, widget: hidden }
          - label: Section header
            name: header
            widget: object
            fields:
              - { label: ID, name: id, widget: hidden }
